<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- ARC family mark, Fuel pillar: sand arc on a graphite tile (see arc/BRANDING.md §4) -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1e2227"/><stop offset="1" stop-color="#121417"/></linearGradient>
    <radialGradient id="wash" cx="0.72" cy="0.22" r="0.7"><stop offset="0" stop-color="#d6b48e" stop-opacity="0.16"/><stop offset="1" stop-color="#d6b48e" stop-opacity="0"/></radialGradient>
    <linearGradient id="sand" x1="0" y1="1" x2="1" y2="0"><stop offset="0" stop-color="#c29f78"/><stop offset="1" stop-color="#ead2b4"/></linearGradient>
    <filter id="sh" x="-30%" y="-30%" width="160%" height="160%"><feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#05070a" flood-opacity="0.55"/></filter>
  </defs>
  <rect width="512" height="512" fill="url(#bg)"/>
  <rect width="512" height="512" fill="url(#wash)"/>
  <g filter="url(#sh)">
    <!-- 3/4 arc: the ARC stroke, read as a fuel ring -->
    <circle cx="256" cy="256" r="132" fill="none" stroke="rgba(255,255,255,0.07)" stroke-width="44"/>
    <circle cx="256" cy="256" r="132" fill="none" stroke="url(#sand)" stroke-width="44" stroke-linecap="round"
      stroke-dasharray="622 830" transform="rotate(-90 256 256)"/>
    <!-- mist dot: the family's primary accent -->
    <circle cx="256" cy="256" r="30" fill="#9fb8cc"/>
  </g>
</svg>
